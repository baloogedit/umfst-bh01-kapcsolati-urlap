<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kapcsolat – ÁOK Dékáni Hivatal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="logo.png" alt="UMFST – Orvosi Kar" width="120" height="40">
    <h1 class="cim">Kapcsolatfelvétel</h1>
  </header>
  <main>
    <p class="lead">Kérdésed van a beiratkozással kapcsolatban? Írj nekünk!</p>
    <form action="#" method="post">
      <label for="nev">Teljes név</label>
      <input type="text" autocomplete="name" id="nev" name="nev" placeholder="Teljes név" required>

      <label for="email">E-mail cím</label>
      <input type="email" autocomplete="email" id="email" name="email" placeholder="E-mail cím" required>

      <label for="tema">Téma</label>
      <select id="tema" name="tema">
        <option>Beiratkozás</option>
        <option>Ösztöndíj</option>
        <option>Egyéb</option>
      </select>

      <label for="uzenet">Üzenet</label>
      <textarea name="uzenet" id="uzenet" placeholder="Üzenet" rows="5"></textarea>
      <button type="submit">Küldés</button>
    </form>
  </main>
  <footer><p class="kicsi">© 2026 UMFST – Minden jog fenntartva</p></footer>
</body>
</html>
